name: iwad_runtime
description: "A Flutter IWAD runtime for app-supplied game data with native and web backends."
version: 0.1.5
homepage: https://github.com/KickNext/iwad_runtime
repository: https://github.com/KickNext/iwad_runtime
topics:
  - flutter
  - ffi
  - wasm
  - game-engine
  - runtime
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.11.5
  flutter: ">=3.3.0"

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  web: ^1.1.1

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

  assets:
    - assets/iwad_runtime_web_loader.js
    - assets/iwad_runtime_web.js
    - assets/iwad_runtime_web.wasm
